name: SemanticSLAM CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install system dependencies for OpenCV and OpenGL
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-glx xvfb libglfw3 libglfw3-dev
        pip install -r requirements.txt
        
    - name: Run tests with pytest
      run: |
        export PYTHONPATH=.
        # Run pytest inside xvfb to allow OpenGL and OpenCV to run headlessly
        xvfb-run -a pytest tests/
